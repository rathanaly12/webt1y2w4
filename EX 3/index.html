<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        background-color: gray;
        display: flex;
        align-items: stretch;
        justify-content:center;
        gap: 25px;
        width: 100vw;
        min-height: 100vh;
        box-sizing: border-box;

      }
      .pricing-plan{
        background-color: white;
        width: 200px;
        height: 300px;
        border-radius: 15px;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;

      }
      .plan-title{
        background-color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
        padding: 10px 0px;
        width: 100%;
        border-radius: 15px 15px 0px 0px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 28px;
        font-family: 'Times New Roman', Times, serif;
      }
      .plan-price{
        height: 50px;
        color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
        display: flex;
        font-family: 'Times New Roman', Times, serif;
        justify-content: center;
        align-items: end;
        font-size: 18px;
        
      }
      .plan-features{
        font-family: 'Times New Roman', Times, serif;
        color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
        height: 120px;
      }
      li{
        margin-bottom: 10px;
        margin-top: 10px;
      }
      .plan-button{
        background-color: pink;
        padding: 10px 40px;
        margin-bottom: 10px;
        border-radius: 20px;
        color: white;
        background-color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
        font-family: 'Times New Roman', Times, serif;
        font-size: 16px;
      }
      button:hover{
        background-color: color-mix(in srgb, #ff0000 30%, #0000ff 70%);
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          background-color: gray;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          align-items:center;
          gap: 25px;
          width: 100vw;
          height: 100%;

        }
        .pricing-plan{
          background-color: white;
          width: 200px;
          height: 300px;
          border-radius: 15px;
          margin-top: 10px;
          display: flex;
          flex-direction: column;
          align-items: center;

        }
        .plan-title{
          background-color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
          padding: 10px 0px;
          width: 100%;
          border-radius: 15px 15px 0px 0px;
          display: flex;
          justify-content: center;
          align-items: center;
          color: white;
          font-size: 28px;
          font-family: 'Times New Roman', Times, serif;
        }
        .plan-price{
          height: 50px;
          color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
          display: flex;
          font-family: 'Times New Roman', Times, serif;
          justify-content: center;
          align-items: end;
          font-size: 18px;
        
        }
        .plan-features{
          font-family: 'Times New Roman', Times, serif;
          color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
          height: 120px;
        }
        li{
          margin-bottom: 10px;
          margin-top: 10px;
        }
        .plan-button{
          background-color: pink;
          padding: 10px 40px;
          margin-bottom: 10px;
          border-radius: 20px;
          color: white;
          background-color: color-mix(in srgb, #ff0000 50%, #0000ff 50%);
          font-family: 'Times New Roman', Times, serif;
          font-size: 16px;
        }
        button:hover{
          background-color: color-mix(in srgb, #ff0000 30%, #0000ff 70%);
        }

      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
